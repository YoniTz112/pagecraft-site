<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedido recebido — Pagecraft</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Instrument+Sans:wght@400;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f3f1ec;color:#121212;font-family:"Instrument Sans",system-ui,sans-serif;padding:24px}
  main{max-width:560px;display:flex;flex-direction:column;gap:24px;align-items:flex-start}
  img{height:38px;width:auto}
  .tag{display:inline-flex;align-items:center;gap:10px;font-family:"JetBrains Mono",monospace;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#55524c}
  .tag i{width:10px;height:10px;border-radius:50%;background:#1b6e48;display:block}
  h1{margin:0;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:clamp(40px,8vw,64px);line-height:1;letter-spacing:-.035em}
  h1 span{color:#2443d6}
  p{margin:0;color:#55524c;font-size:18px;line-height:1.5}
  .acts{display:flex;flex-wrap:wrap;gap:14px}
  a.btn{display:inline-flex;align-items:center;min-height:52px;padding:0 26px;border:1.5px solid #121212;border-radius:10px;font-weight:600;text-decoration:none;color:#121212}
  a.btn.pri{background:#2443d6;color:#f3f1ec;box-shadow:4px 4px 0 #121212}
  a.btn.pri:hover{background:#1a31a3}
  a.btn:not(.pri):hover{background:#e9e6df}
</style>
</head>
<body>
<main>
  <img src="/assets/pagecraft-logo.svg" alt="pagecraft" width="161" height="38">
  <span class="tag"><i></i>Pedido recebido</span>
  <h1>Valeu! Já já a gente <span>te responde.</span></h1>
  <p>Sua mensagem foi aberta no WhatsApp. É só tocar em enviar, se ainda não enviou. A gente responde o mais rápido possível com o orçamento.</p>
  <div class="acts">
    <a class="btn pri" href="https://wa.me/5521966920110?text=Ol%C3%A1%2C%20Pagecraft!%20Quero%20um%20or%C3%A7amento%20de%20site." target="_blank" rel="noopener">Abrir o WhatsApp de novo</a>
    <a class="btn" href="/">Voltar para o site</a>
  </div>
</main>
</body>
</html>
